<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Autofill — Sample Application Form</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
      h1 { font-size: 20px; }
      .field { margin-bottom: 16px; display: flex; flex-direction: column; gap: 4px; }
      label { font-size: 13px; font-weight: 600; }
      input, select, textarea { padding: 8px; font-size: 14px; }
      fieldset { border: 1px solid #ccc; border-radius: 6px; }
      .note { color: #666; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>Sample Job Application</h1>
    <p class="note">
      Load the unpacked extension, then open this file. A ⚡ icon should appear next to each
      field — click it to fill from your saved profile.
    </p>
    <form>
      <div class="field">
        <label for="first_name">First Name *</label>
        <input id="first_name" name="first_name" required />
      </div>
      <div class="field">
        <label for="last_name">Last Name *</label>
        <input id="last_name" name="last_name" required />
      </div>
      <div class="field">
        <label for="email">Email *</label>
        <input id="email" name="email" type="email" required />
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" />
      </div>
      <div class="field">
        <label for="city">City</label>
        <input id="city" name="city" />
      </div>
      <div class="field">
        <label for="state">State</label>
        <input id="state" name="state" />
      </div>
      <div class="field">
        <label for="linkedin">LinkedIn Profile</label>
        <input id="linkedin" name="linkedin" type="url" />
      </div>
      <div class="field">
        <label for="github">GitHub</label>
        <input id="github" name="github" type="url" />
      </div>
      <div class="field">
        <label for="school">School / University</label>
        <input id="school" name="school" />
      </div>
      <div class="field">
        <label for="degree">Degree</label>
        <input id="degree" name="degree" />
      </div>
      <div class="field">
        <label for="resume">Resume / CV</label>
        <input id="resume" name="resume" type="file" accept="application/pdf" />
      </div>
      <fieldset class="field">
        <legend>Are you authorized to work in the US? *</legend>
        <label><input type="radio" name="auth" value="yes" /> Yes</label>
        <label><input type="radio" name="auth" value="no" /> No</label>
      </fieldset>
      <fieldset class="field">
        <legend>Will you now or in the future require sponsorship?</legend>
        <label><input type="radio" name="sponsor" value="yes" /> Yes</label>
        <label><input type="radio" name="sponsor" value="no" /> No</label>
      </fieldset>
      <div class="field">
        <label for="country">Country</label>
        <select id="country" name="country">
          <option value="">Select…</option>
          <option>United States</option>
          <option>Canada</option>
          <option>India</option>
        </select>
      </div>
      <div class="field">
        <label for="why">Why do you want to work here?</label>
        <textarea id="why" name="why" rows="4"></textarea>
      </div>
      <button type="button" onclick="alert('This sample never submits.')">Submit</button>
    </form>
  </body>
</html>
